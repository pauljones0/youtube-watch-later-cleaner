name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify generated console script
        run: |
          node build.mjs
          git diff --exit-code -- removeWatchLater.js
      - name: Build extension
        run: ./package.sh
